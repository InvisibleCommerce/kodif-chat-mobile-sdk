name: iOS

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The runner's default Xcode, with whichever iPhone simulator it has installed (names change between images).
      - name: Pick an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True) if "iOS" in runtime
                     for d in ds if d["name"].startswith("iPhone")))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test KodifChat
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme KodifChat \
            -destination 'id=${{ steps.simulator.outputs.udid }}' \
            -resultBundlePath build/KodifChatTests.xcresult

      - name: Build the example app
        working-directory: ios/Example
        run: |
          set -o pipefail
          xcodebuild build \
            -project KodifChatExample.xcodeproj \
            -scheme KodifChatExample \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-test-results
          path: build/KodifChatTests.xcresult
