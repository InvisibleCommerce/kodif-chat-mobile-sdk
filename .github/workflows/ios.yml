name: iOS

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Test KodifChat
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme KodifChat \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath build/KodifChatTests.xcresult

      - name: Build the example app
        working-directory: ios/Example
        run: |
          set -o pipefail
          xcodebuild build \
            -project KodifChatExample.xcodeproj \
            -scheme KodifChatExample \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-test-results
          path: build/KodifChatTests.xcresult
